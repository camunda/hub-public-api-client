rules:
  unpinned-uses:
    config:
      policies:
        actions/*: ref-pin
        github/*: ref-pin
        camunda/infra-global-github-actions/*: hash-pin
        "*": hash-pin
    ignore: []
  # TODO: re-enable once the existing findings are fixed
  artipacked:
    disable: true
  excessive-permissions:
    disable: true
  template-injection:
    disable: true
